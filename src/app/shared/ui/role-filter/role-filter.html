<div class="relative w-60">
      <select
        [ngModel]="selectedRoleId"
        (ngModelChange)="onSelect($event)"
        class="w-full appearance-none rounded-full bg-neutral-100/80 py-2.5 pl-5 pr-10 text-sm font-semibold text-neutral-700 outline-none transition-all hover:bg-neutral-200/60 focus:ring-2 focus:ring-purple-500/20 cursor-pointer"
      >
        <option value="" disabled selected>Role Name</option>
        @for (role of roles; track role.id) {
          <option [value]="role.id">{{ role.roleName }}</option>
        }
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-neutral-400">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>
