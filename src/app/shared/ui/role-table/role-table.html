<div class="overflow-x-auto">
  <table class="w-full text-left text-sm text-neutral-800">
    <thead>
      <tr class="text-[0.8125rem] font-bold text-neutral-800">
        <th class="py-4 pl-4">Nama Role</th>
        <th class="py-4">Deskripsi</th>
        <th class="py-4 text-center">Status</th>
        <th class="py-4 pr-4 text-center">Aksi</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-neutral-100 text-sm">
      @for (role of roles; track role.id) {
        <tr class="hover:bg-neutral-50/50 transition-colors">
          <!-- Nama Role -->
          <td class="py-5 pl-4 font-bold text-tertiary-900 uppercase">
            {{ role.roleName }}
          </td>

          <!-- Deskripsi -->
          <td class="py-5 text-neutral-600 max-w-md">
            {{ role.description }}
          </td>

          <!-- Status Badge -->
            <td class="py-4 text-center">
              <span
                [ngClass]="{
                  'bg-secondary-100 text-secondary-700': role.status === 'Active',
                  'bg-neutral-200/80 text-neutral-600': role.status === 'Inactive'
                }"
                class="inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-xs font-semibold"
              >
                <span
                  [ngClass]="{
                    'bg-secondary-600': role.status === 'Active',
                    'bg-neutral-500': role.status === 'Inactive'
                  }"
                  class="h-2 w-2 rounded-full"
                ></span>
                {{ role.status }}
              </span>
            </td>

            <td class="py-4 pr-4 text-right">
              <div class="flex items-center justify-end gap-3 text-neutral-600">
                <!-- Pencil / Edit Icon -->
                <button
                  *appHasPermission="'canEdit'"
                  (click)="onEdit(role)"
                  type="button"
                  title="Edit Role"
                  class="p-1 transition-colors hover:text-secondary-600"
                >
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                  </svg>
                </button>

                <!-- Trash / Delete Icon -->
                <button
                  *appHasPermission="'canDelete'"
                  (click)="onDeactivate(role)"
                  type="button"
                  [title]="role.status === 'Active' ? 'Deactivate Role' : 'Activate Role'"
                  [class]="role.status === 'Active' ? 'p-1 transition-colors hover:text-amber-600 text-neutral-400' : 'p-1 transition-colors hover:text-emerald-600 text-emerald-500'"
                >
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728M12 3v9" />
                  </svg>
                </button>
              </div>
            </td>
      }
    </tbody>
  </table>
</div>
