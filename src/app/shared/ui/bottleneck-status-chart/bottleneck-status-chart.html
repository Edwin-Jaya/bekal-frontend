<div
  class="flex h-full flex-col rounded-[1.5rem] border border-white/60 bg-white/70 p-6 shadow-sm backdrop-blur-md"
>
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-neutral-800">Pipeline Bottleneck</h2>
      <p class="text-xs text-neutral-400 mt-0.5">
        Distribusi pengajuan per tahap
      </p>
    </div>
    <span class="text-xs font-bold text-neutral-400"
      >{{ totalCount }} total</span
    >
  </div>

  <!-- Stage Bars -->
  <div class="flex flex-col gap-3 flex-1 justify-center">
    <div *ngFor="let item of stages" class="flex flex-col gap-1">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-neutral-600"
          >{{ item.label }}</span
        >
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-neutral-800"
            >{{ item.count }}</span
          >
          <span class="text-[10px] text-neutral-400"
            >({{ getPercent(item.count) }}%)</span
          >
        </div>
      </div>
      <!-- Bar Track -->
      <div class="h-2.5 w-full rounded-full bg-neutral-100 overflow-hidden">
        <div
          class="h-full rounded-full transition-all duration-700 ease-out"
          [style.width.%]="getPercent(item.count)"
          [style.backgroundColor]="item.color || '#a855f7'"
        ></div>
      </div>
    </div>
  </div>

  <!-- Bottleneck Warning -->
  <div
    *ngIf="bottleneckStage"
    class="mt-4 flex items-center gap-2 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2"
  >
    <svg
      class="w-4 h-4 text-amber-500 shrink-0"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
      />
    </svg>
    <p class="text-xs font-semibold text-amber-700">
      Bottleneck: <span class="font-bold">{{ bottleneckStage.label }}</span> ({{
      bottleneckStage.count }} apps)
    </p>
  </div>
</div>
