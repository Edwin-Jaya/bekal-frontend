<div class="flex flex-col items-center justify-between gap-4 border-t border-neutral-200/60 pt-4 sm:flex-row">
      <!-- Info Entry Data -->
      <div class="text-xs text-neutral-400">
        Showing
        <span class="font-semibold text-neutral-400">{{ startItem }}</span>
        to
        <span class="font-semibold text-neutral-400">{{ endItem }}</span>
        of
        <span class="font-semibold text-neutral-400">{{ totalElements }}</span>
        entries
      </div>

      <!-- Navigation Buttons -->
        <div class="flex items-center gap-2">
          <!-- Previous Button -->
          <button
            (click)="goToPage(currentPage - 1)"
            [disabled]="currentPage === 0"
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-full border border-neutral-200 bg-white text-xs font-bold text-neutral-500 transition-colors hover:bg-neutral-100 disabled:opacity-40 disabled:cursor-not-allowed"
          >
            &lt;
          </button>

        <!-- Dynamic Page Numbers -->
        @for (page of pageNumbers; track $index) {
          @if (page === -1) {
            <span class="px-2 py-1 text-sm text-neutral-400">...</span>
          } @else {
            <button
              type="button"
              (click)="goToPage(page)"
              [class]="page === currentPage
                ? 'flex h-9 w-9 items-center justify-center rounded-full bg-purple-600 text-xs font-bold text-white shadow-sm'
                : 'flex h-9 w-9 items-center justify-center rounded-full text-xs font-medium text-neutral-700 hover:bg-neutral-100'"
            >
              {{ page + 1 }}
            </button>
          }
        }

        <!-- Next Button -->
          <button
            (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage >= totalPages - 1 || totalPages === 0"
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-full border border-neutral-200 bg-white text-xs font-bold text-neutral-500 transition-colors hover:bg-neutral-100 disabled:opacity-40 disabled:cursor-not-allowed"
          >
              &gt;
        </button>
      </div>
    </div>
