@if (feedbackService.state(); as data) {
  <!-- Modal Backdrop -->
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-primary-950/60 backdrop-blur-sm transition-opacity duration-200"
    (click)="close()"
  >
    <!-- Modal Card -->
    <div 
      class="w-full max-w-md transform overflow-hidden rounded-card bg-surface-card p-6 md:p-8 text-center shadow-2xl transition-all dark:bg-primary-900 border border-neutral-200/50 dark:border-primary-800"
      (click)="$event.stopPropagation()"
    >
      <!-- Status Icon -->
      <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full">
        @switch (data.type) {
          @case ('success') {
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-success-500/10 text-success-500">
              <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            </div>
          }
          @case ('error') {
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-error-500/10 text-error-500">
              <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </div>
          }
          @case ('warning') {
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-warning-500/10 text-warning-500">
              <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
              </svg>
            </div>
          }
          @case ('info') {
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-info-500/10 text-info-500">
              <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12v-.008z" />
              </svg>
            </div>
          }
        }
      </div>

      <!-- Title & Message -->
      <h3 class="text-xl font-bold tracking-tight text-primary-900 dark:text-neutral-50 mb-2">
        {{ data.title }}
      </h3>
      <p class="text-neutral-600 dark:text-neutral-300 text-sm leading-relaxed mb-6">
        {{ data.message }}
      </p>

      <!-- Action Buttons -->
      <div class="flex flex-col-reverse sm:flex-row gap-3 justify-center">
        @if (data.cancelText) {
          <button 
            type="button" 
            class="w-full rounded-btn px-5 py-2.5 text-sm font-semibold text-neutral-700 dark:text-neutral-200 bg-neutral-200 hover:bg-neutral-300 dark:bg-primary-800 dark:hover:bg-primary-700 transition-colors cursor-pointer"
            (click)="onCancel(data)"
          >
            {{ data.cancelText }}
          </button>
        }
        <button 
          type="button" 
          class="w-full rounded-btn px-5 py-2.5 text-sm font-semibold text-neutral-50 bg-primary-900 hover:bg-primary-800 dark:bg-secondary-500 dark:hover:bg-secondary-600 transition-colors cursor-pointer"
          (click)="onConfirm(data)"
        >
          {{ data.confirmText || 'OK' }}
        </button>
      </div>
    </div>
  </div>
}
