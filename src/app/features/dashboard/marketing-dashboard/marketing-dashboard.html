<div
  class="relative min-h-screen w-full overflow-hidden bg-gradient-to-br from-secondary-100 via-white to-secondary-200 p-6 md:p-8"
>
  <div
    class="pointer-events-none absolute -top-24 -left-24 h-96 w-96 rounded-full bg-secondary-300/40 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-secondary-200/50 blur-3xl"
  ></div>

  <div
    class="relative z-10 mx-auto max-w-7xl space-y-6"
    *ngIf="overviewData() as data"
  >
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900">
        Marketing Overview
      </h1>
    </div>

    <!-- Row 1: Marketing Metric Cards (Focused on Input & Review Queue) -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <app-metric-card
        title="Total Pengajuan"
        [value]="data.metrics.totalPengajuan.value"
        [subtext]="data.metrics.totalPengajuan.subtext"
        [subtextColor]="data.metrics.totalPengajuan.subtextColor"
      />
      <app-metric-card
        title="Antrean Review"
        [value]="data.metrics.antreanReview.value"
        [subtext]="data.metrics.antreanReview.subtext"
        [subtextColor]="data.metrics.antreanReview.subtextColor"
      />
      <app-metric-card
        title="Total Dicairkan"
        [value]="data.metrics.totalDicairkan.value"
        [subtext]="data.metrics.totalDicairkan.subtext"
        [subtextColor]="data.metrics.totalDicairkan.subtextColor"
      />
    </div>

    <!-- Row 2: Performance Charts -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
      <div class="lg:col-span-2">
        <app-operational-trend-chart [data]="data.charts.operationalTrend" />
      </div>
      <div class="lg:col-span-1">
        <app-bottleneck-status-chart [data]="data.charts.bottleneckStatus" />
      </div>
    </div>

    <!-- Row 3: Recent Marketing Submissions Table -->
    <div class="w-full">
      <app-recent-activity-table [data]="data.recentActivities" />
    </div>
  </div>
</div>
