<!-- Background gradient penuh layar -->
<div class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden
            bg-gradient-to-br from-secondary-100 via-white to-secondary-200 px-4">

  <!-- Blob dekoratif blur untuk depth glassmorphism -->
  <div class="pointer-events-none absolute -top-24 -left-24 w-96 h-96 rounded-full bg-secondary-300/40 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-secondary-200/50 blur-3xl"></div>

  <!-- Logo -->
  <div class="relative z-10 flex items-center gap-3 mb-8">
    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-white/60 backdrop-blur-md border border-white/60 shadow-sm">
      <!-- <svg class="w-6 h-6 text-primary-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg> -->
      <img src="icon.svg" alt="">
    </div>
    <span class="text-2xl font-extrabold tracking-tight font-sans text-primary-900">BEKAL</span>
  </div>

  <!-- Glass card -->
  <div class="relative z-10 w-full max-w-md rounded-3xl bg-white/40 backdrop-blur-2xl
              border border-white/60 shadow-2xl p-8 sm:p-10">

    <h1 class="text-4xl text-center font-extrabold text-primary-900 font-sans mb-8">
      Welcome<span class="text-secondary-500">.</span>
    </h1>

    @if (errorMessage()) {
      <div class="flex items-center gap-3 rounded-xl border border-red-300 bg-red-100/60 backdrop-blur-sm p-4 text-red-700 mb-5" role="alert">
        <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-red-600 text-sm font-bold text-white">
          !
        </div>
        <p class="text-sm font-normal leading-snug">{{ errorMessage() }}</p>
      </div>
    }

    <form (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="mb-5">
        <label class="block text-xs font-semibold uppercase tracking-wide text-neutral-600 mb-2" for="email">
          Email Address
        </label>
        <div class="relative">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-neutral-400">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <input
            id="email"
            name="email"
            type="email"
            required
            [(ngModel)]="email"
            placeholder="you@example.com"
            class="w-full rounded-full bg-white/50 backdrop-blur-sm border border-white/70 py-3.5 pl-12 pr-4
                   text-sm text-primary-900 placeholder-neutral-400 shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-secondary-400 focus:border-transparent"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-5">
        <label class="block text-xs font-semibold uppercase tracking-wide text-neutral-600 mb-2" for="password">
          Password
        </label>
        <div class="relative">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-neutral-400">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            required
            [(ngModel)]="password"
            placeholder="••••••••"
            class="w-full rounded-full bg-white/50 backdrop-blur-sm border border-white/70 py-3.5 pl-12 pr-12
                   text-sm text-primary-900 placeholder-neutral-400 shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-secondary-400 focus:border-transparent"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-4 text-neutral-400 hover:text-neutral-600 focus:outline-none"
          >
            @if (showPassword()) {
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
              </svg>
            } @else {
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Remember me + Forgot password -->
      <div class="flex items-center justify-between mb-7">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <button
            type="button"
            (click)="toggleRememberMe()"
            [class]="rememberMe()
              ? 'w-9 h-5 rounded-full bg-secondary-500 flex items-center px-0.5 transition-colors'
              : 'w-9 h-5 rounded-full bg-neutral-300 flex items-center px-0.5 transition-colors'"
          >
            <span
              [class]="rememberMe()
                ? 'w-4 h-4 rounded-full bg-white shadow translate-x-4 transition-transform'
                : 'w-4 h-4 rounded-full bg-white shadow translate-x-0 transition-transform'"
            ></span>
          </button>
          <span class="text-sm text-neutral-600">Remember me</span>
        </label>

      </div>

      <!-- Submit pakai ButtonComponent -->
      <app-button
        type="submit"
        variant="inverted"
        size="lg"
        [fullWidth]="true"
        [disabled]="isLoading()"
        class="block w-full"
      >
        <span class="flex-1 text-center">
          {{ isLoading() ? 'Signing in...' : 'Log In' }}
        </span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </app-button>

    </form>
  </div>
</div>
