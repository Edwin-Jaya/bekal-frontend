    <!-- Overlay Backdrop -->
    <div
      *ngIf="isOpen"
      class="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/40 p-4 backdrop-blur-sm transition-opacity"
    >
      <!-- Modal Card -->
      <div
        class="w-full max-w-2xl transform rounded-[2rem] bg-white p-8 shadow-2xl transition-all"
      >
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-6 border-b border-neutral-100">
          <h2 class="text-xl font-bold text-neutral-900">
            {{ userToEdit ? 'Edit User' : 'Tambah User Baru' }}
          </h2>
          <button
            (click)="close()"
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-full text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 transition-colors"
          >
            ✕
          </button>
        </div>

        <!-- Form Grid -->
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
          <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-2">
            
            <!-- Cabang (Branch ID) -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Cabang (Branch)
              </label>
              <div class="relative">
                <select
                  formControlName="branchId"
                  class="w-full appearance-none rounded-full bg-neutral-100/70 px-4 py-2.5 pr-10 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none"
                >
                  <option value="" disabled selected>Pilih Cabang</option>
                  <option
                    *ngFor="let branch of branches"
                    [value]="branch.id"
                  >
                    {{ branch.branchName }} ({{ branch.branchCode }})
                  </option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-neutral-400">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- Role (Role ID) -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Role
              </label>
              <div class="relative">
                <select
                  formControlName="roleId"
                  class="w-full appearance-none rounded-full bg-neutral-100/70 px-4 py-2.5 pr-10 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none"
                >
                  <option value="" disabled selected>Pilih Role</option>
                  <option
                    *ngFor="let role of roles"
                    [value]="role.id"
                  >
                    {{ role.roleName }}
                  </option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-neutral-400">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- Full Name -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Full Name
              </label>
              <input
                type="text"
                formControlName="full_name"
                placeholder="Masukkan nama lengkap"
                class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
              />
            </div>

            <!-- Email -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Email
              </label>
              <input
                type="email"
                formControlName="email"
                placeholder="email@bekal.com"
                class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
              />
            </div>

            <!-- Password -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Password {{ userToEdit ? '(Kosongkan jika tidak diubah)' : '' }}
              </label>
              <input
                type="password"
                formControlName="password"
                placeholder="••••••••"
                class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
              />
            </div>

            <!-- Phone Number -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Phone Number
              </label>
              <input
                type="tel"
                formControlName="phone_number"
                placeholder="0812..."
                class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
              />
            </div>

            <!-- Status -->
            <div>
              <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
                Status
              </label>
              <div class="flex items-center pt-1">
                <button
                  type="button"
                  (click)="toggleStatus()"
                  class="inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-xs font-semibold transition-all"
                  [ngClass]="{
                    'bg-secondary-100 text-secondary-600': userForm.get('status')?.value === 'Active',
                    'bg-neutral-200 text-neutral-600': userForm.get('status')?.value === 'Inactive'
                  }"
                >
                  <span
                    class="h-2 w-2 rounded-full"
                    [ngClass]="{
                      'bg-secondary-600': userForm.get('status')?.value === 'Active',
                      'bg-neutral-500': userForm.get('status')?.value === 'Inactive'
                    }"
                  ></span>
                  {{ userForm.get('status')?.value }}
                </button>
              </div>
            </div>

          </div>

          <!-- Actions Footer -->
          <div class="flex items-center justify-end gap-3 pt-6 border-t border-neutral-100">
            <button
              (click)="close()"
              type="button"
              class="rounded-full border border-neutral-200 bg-white px-7 py-2.5 text-xs font-semibold text-neutral-800 hover:bg-neutral-50 transition-colors"
            >
              Batal
            </button>
            <button
              type="submit"
              [disabled]="userForm.invalid"
              class="rounded-full bg-neutral-950 px-7 py-2.5 text-xs font-semibold text-white transition-all hover:bg-neutral-800 disabled:opacity-40"
            >
              {{ userToEdit ? 'Update User' : 'Simpan User' }}
            </button>
          </div>
        </form>
      </div>
    </div>
