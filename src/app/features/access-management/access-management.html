<div class="relative min-h-screen w-full overflow-hidden bg-gradient-to-br from-secondary-100 via-white to-secondary-200 p-6 md:p-8">
  
  <!-- Decorative Glow Orbs -->
  <div class="pointer-events-none absolute -top-24 -left-24 h-96 w-96 rounded-full bg-secondary-300/40 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-secondary-200/50 blur-3xl"></div>

  <!-- Main Container -->
  <div class="relative z-10 mx-auto max-w-7xl space-y-6">

    <!-- Header Section -->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900">Access Management</h1>

          <button
      type="button"
      (click)="onSave()"
      [disabled]="!selectedRoleId || matrix.length === 0 || isSaving"
      class="inline-flex items-center gap-2 rounded-full bg-purple-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500/20 disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (isSaving) {
        <!-- Spinner SVG -->
        <svg class="h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Saving...</span>
      } @else {
        <!-- Check Icon SVG -->
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>Save Changes</span>
      }
    </button>
  </div>

  <!-- Banner Alert Success / Error (Opsional) -->
  @if (successMessage) {
    <div class="mb-5 rounded-xl bg-emerald-50 p-4 text-sm text-emerald-700 border border-emerald-200 flex items-center justify-between">
      <span>{{ successMessage }}</span>
    </div>
  }
  @if (errorMessage) {
    <div class="mb-5 rounded-xl bg-rose-50 p-4 text-sm text-rose-700 border border-rose-200 flex items-center justify-between">
      <span>{{ errorMessage }}</span>
    </div>
  }
    </div>

    <!-- Table Card Container -->
    <div class="rounded-[1.5rem] border border-white/60 bg-white/70 p-6 shadow-sm backdrop-blur-md space-y-6">
      
      <!-- Filter Tabs -->
      <div>
      <app-role-filter
        [roles]="roles"
        [selectedRoleId]="selectedRoleId"
        (roleSelect)="onRoleSelected($event)"
      />
      </div>

      <!-- User Table -->
      <app-access-table
            [matrix]="matrix"
            [selectedRoleId]="selectedRoleId"
            [isLoading]="isLoading"
            (roleSelect)="onRoleSelected($event)"
            (matrixChange)="onMatrixUpdated($event)"
            />
            

      <!-- Table Footer / Pagination -->
     <!-- Pagination Component -->
      @if (selectedRoleId && totalElements > 0) {
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalElements]="totalElements"
          [pageSize]="pageSize"
          (pageChange)="onPageChanged($event)"
        />
      }

    </div>

  </div>
