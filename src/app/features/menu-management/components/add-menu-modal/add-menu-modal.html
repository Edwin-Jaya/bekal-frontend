<!-- Overlay Backdrop -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/40 p-4 backdrop-blur-sm transition-opacity"
>
  <!-- Modal Card -->
  <div
    class="w-full max-w-lg transform rounded-[2rem] bg-white p-8 shadow-2xl transition-all"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-6 border-b border-neutral-100">
      <h2 class="text-xl font-bold text-neutral-900">
        {{ menuToEdit ? 'Edit Menu' : 'Tambah Menu Baru' }}
      </h2>
      <button
        (click)="close()"
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-full text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 transition-colors"
      >
        ✕
      </button>
    </div>

    <!-- Form Grid -->
    <form [formGroup]="menuForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
      <div class="space-y-4">
        
        <!-- Menu Name -->
        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
            Nama Menu
          </label>
          <input
            type="text"
            formControlName="menuName"
            placeholder="Masukkan nama menu (cth: User Management)"
            class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
          />
        </div>

        <!-- Menu Path -->
        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
            Path / Route
          </label>
          <input
            type="text"
            formControlName="menuPath"
            placeholder="Masukkan path (cth: /admin/users)"
            class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400 font-mono"
          />
        </div>

        <!-- Grid 2 Kolom: Menu Icon & Sort Order -->
        <div class="grid grid-cols-2 gap-4">
          <!-- Menu Icon -->
          <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
              Icon
            </label>
            <input
              type="text"
              formControlName="menuIcon"
              placeholder="cth: clipboard-user"
              class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400 font-mono"
            />
          </div>

          <!-- Sort Order -->
          <div>
            <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
              Urutan (Sort Order)
            </label>
            <input
              type="number"
              formControlName="menuSortOrder"
              placeholder="1"
              class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none placeholder:text-neutral-400"
            />
          </div>
        </div>

        <!-- Parent Menu (Optional/Dropdown/Input) -->
        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
            Parent Menu <span class="text-neutral-400 font-normal">(Opsional)</span>
          </label>
          <select
            formControlName="menuParentId"
            class="w-full rounded-full bg-neutral-100/70 px-4 py-2.5 text-xs font-medium text-neutral-800 border border-neutral-200/50 focus:border-secondary-400 focus:bg-white focus:outline-none"
          >
            <option [ngValue]="null">-- Tanpa Parent (Root Menu) --</option>
            @for (parent of availableParents; track parent.id) {
              <option [value]="parent.id">
                {{ parent.menuName }}
              </option>
            }
          </select>
        </div>

        <!-- Status (menuIsActive) -->
        <div>
          <label class="block text-xs font-semibold text-neutral-700 mb-1.5">
            Status
          </label>
          <div class="flex items-center pt-1">
          <button
            type="button"
            (click)="toggleStatus()"
            class="inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-xs font-semibold transition-all"
            [ngClass]="{
              'bg-secondary-100 text-secondary-600': menuForm.get('menuIsActive')?.value,
              'bg-neutral-200 text-neutral-600': !menuForm.get('menuIsActive')?.value
            }"
          >
            <span
              class="h-2 w-2 rounded-full"
              [ngClass]="{
                'bg-secondary-600': menuForm.get('menuIsActive')?.value,
                'bg-neutral-500': !menuForm.get('menuIsActive')?.value
              }"
            ></span>
            {{ menuForm.get('menuIsActive')?.value ? 'Active' : 'Inactive' }}
          </button>
          </div>
        </div>

      </div>

      <!-- Actions Footer -->
      <div class="flex items-center justify-end gap-3 pt-6 border-t border-neutral-100">
        <button
          (click)="close()"
          type="button"
          class="rounded-full border border-neutral-200 bg-white px-7 py-2.5 text-xs font-semibold text-neutral-800 hover:bg-neutral-50 transition-colors"
        >
          Batal
        </button>
        <button
          type="submit"
          [disabled]="menuForm.invalid"
          class="rounded-full bg-neutral-950 px-7 py-2.5 text-xs font-semibold text-white transition-all hover:bg-neutral-800 disabled:opacity-40"
        >
          {{ menuToEdit ? 'Update Menu' : 'Simpan Menu' }}
        </button>
      </div>
    </form>
  </div>
</div>
