<div class="relative min-h-screen w-full overflow-hidden bg-gradient-to-br from-secondary-100 via-white to-secondary-200 p-6 md:p-8">
  
  <!-- Decorative Glow Orbs -->
  <div class="pointer-events-none absolute -top-24 -left-24 h-96 w-96 rounded-full bg-secondary-300/40 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-secondary-200/50 blur-3xl"></div>
    <!-- Main Container -->
  <div class="relative z-10 mx-auto max-w-7xl space-y-6">

    <!-- Header Section -->
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900">Menu Management</h1>
      
      <!-- Button Tambah User -->
      <button
        *appHasPermission="'canCreate'"
        (click)="openAddModal()"
        type="button"
        class="inline-flex items-center gap-2 rounded-full bg-secondary-600 px-6 py-2.5 text-sm font-semibold text-white shadow-md transition-all hover:bg-secondary-700 hover:shadow-lg active:scale-95"
      >
        <span class="text-lg font-medium">+</span>
        <span>Tambah Menu</span>
      </button>
    </div>

      <app-add-menu-modal
        [isOpen]="isAddModalOpen"
        [menuToEdit]="selectedMenuForEdit"
        [parentMenuItems]="menuList"
        (closeModal)="isAddModalOpen = false"
        (menuSaved)="onMenuSaved($event)"
      >
      </app-add-menu-modal>

        <!-- Card Container Utama -->
      <div class="rounded-[1.5rem] border border-white/60 bg-white/70 p-6 shadow-sm backdrop-blur-md space-y-6">
          
          <!-- Filter Tabs (All Roles / Active Only) -->
      <div>
          <app-filter-tabs
          [activeTab]="activeTab"
          (tabChanged)="onTabChanged($event)"
          />
        </div>

        <app-menu-table
        [menus]="allMenus",
        (editMenu)="openEditModal($event)"
        (deactivate)="handleDeactivateMenu($event)"/>

        <!-- Table Footer / Pagination -->
        <div class="flex flex-col items-center justify-between gap-4 border-t border-neutral-200/60 pt-4 sm:flex-row">
          <!-- Entries info -->
          <p class="text-xs font-semibold text-neutral-400">
            Showing {{ totalEntries === 0 ? 0 : (currentPage - 1) * 10 + 1 }} to {{ (currentPage - 1) * 10 + allMenus.length }} of {{ totalEntries }} entries
          </p>

          <!-- Pagination Buttons -->
          <div class="flex items-center gap-2">
            <!-- Previous Button -->
            <button
              (click)="setPage(currentPage - 1)"
              [disabled]="currentPage === 1"
              type="button"
              class="flex h-8 w-8 items-center justify-center rounded-full border border-neutral-200 bg-white text-xs font-bold text-neutral-500 transition-colors hover:bg-neutral-100 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              &lt;
            </button>

            <!-- Dynamic Page Buttons -->
            @for (page of pages; track page) {
              <button
                (click)="setPage(page)"
                type="button"
                [ngClass]="{
                  'bg-secondary-600 text-white shadow-sm': currentPage === page,
                  'bg-white border border-neutral-200 text-neutral-700 hover:bg-neutral-100': currentPage !== page
                }"
                class="flex h-8 w-8 items-center justify-center rounded-full text-xs font-bold transition-all"
              >
                {{ page }}
              </button>
            }

            <!-- Next Button -->
            <button
              (click)="setPage(currentPage + 1)"
              [disabled]="currentPage === totalPages || totalPages === 0"
              type="button"
              class="flex h-8 w-8 items-center justify-center rounded-full border border-neutral-200 bg-white text-xs font-bold text-neutral-500 transition-colors hover:bg-neutral-100 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              &gt;
            </button>
          </div>
        </div>

        </div>

      </div>
</div>
